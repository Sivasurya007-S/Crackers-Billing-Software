<div class="split-container" style="grid-template-columns: 420px 1fr;">
    <!-- Invoice details and Item Selector -->
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        <!-- Customer Search Card -->
        <div class="card">
            <h3 style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                <span>👤</span> Customer Assignment
            </h3>

            <div class="search-container">
                <label for="customerSearch">Search Customer</label>
                <input type="text" id="customerSearch" placeholder="Type name or phone..."
                    onkeyup="searchCustomerAutoComplete()">
                <div id="customerSuggestions" class="suggestions-dropdown"></div>
            </div>

            <input type="hidden" id="customerId">
            <div id="selectedCustomerInfo"
                style="margin-top: -0.5rem; margin-bottom: 0.5rem; font-size: 0.85rem; color: #10b981; font-weight: 600; display: none;">
                Selected: <span id="customerNameSpan"></span>
            </div>
        </div>

        <!-- Product Selector Card -->
        <div class="card">
            <h3 style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                <span>🎆</span> Add Firework Item
            </h3>

            <div class="search-container">
                <label for="productSearch">Product Search</label>
                <input type="text" id="productSearch" placeholder="Type product name or code..."
                    onkeyup="searchProductAutoComplete()">
                <div id="suggestions" class="suggestions-dropdown"></div>
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" placeholder="Name" readonly>
                </div>
                <div>
                    <label for="rate">Rate (₹)</label>
                    <input type="number" id="rate" placeholder="0.00" readonly>
                </div>
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label for="stock">Available Stock</label>
                    <input type="number" id="stock" placeholder="0" readonly>
                </div>
                <div>
                    <label for="qty">Bill Quantity</label>
                    <input type="number" id="qty" placeholder="Enter qty..." min="1">
                </div>
            </div>

            <button onclick="addItem()" style="width: 100%; margin-top: 0.5rem;">
                ✨ Add to Receipt
            </button>
        </div>
    </div>

    <!-- Live Bill Receipt Card -->
    <div class="card" style="display: flex; flex-direction: column; height: 100%; min-height: 500px;">
        <h3 style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <span>📋</span> Current Invoice Receipt
        </h3>

        <div class="table-container" style="flex: 1; max-height: 300px; overflow-y: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Product</th>
                        <th style="text-align: center;">Rate</th>
                        <th style="text-align: center;">Qty</th>
                        <th style="text-align: right;">Amount</th>
                        <th style="width: 140px; text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="billItems">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 3rem;">
                            No items added yet. Search and add a product.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <hr>

        <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 2rem; align-items: end;">
            <div>
                <div style="display: flex; justify-content: space-between; font-size: 1rem; margin-bottom: 0.75rem;">
                    <span style="color: var(--text-muted);">Subtotal:</span>
                    <span style="font-weight: 600;">₹ <span id="subtotal">0</span></span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
                    <label for="discount" style="font-size: 0.9rem; flex-shrink: 0; margin-bottom: 0;">Discount
                        (%)</label>
                    <input type="number" id="discount" value="0" min="0" max="100" oninput="renderBill()"
                        onkeyup="renderBill()" style="margin: 0; width: 80px;">
                    <span id="discountAmountLabel" style="font-size: 0.85rem; color: #10b981; font-weight: 600;"></span>
                </div>
            </div>

            <div style="text-align: right; display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <p
                        style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0;">
                        Grand Total</p>
                    <h2
                        style="font-size: 2.2rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                        ₹ <span id="total">0</span></h2>
                </div>

                <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <button class="success" onclick="saveBill()">💾 Save Invoice</button>
                    <button class="secondary" id="btnPrintInvoice" onclick="printBill()">🖨️ Print PDF</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Canvas particles overlay for celebratory success fireworks -->
<canvas id="fireworksCanvas"
    style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; display: none;"></canvas>

<script src="../assets/js/billing.js"></script>
