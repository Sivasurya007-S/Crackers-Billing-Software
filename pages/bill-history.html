<div class="card" style="padding: 1.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h3>📜 Invoice History Directory</h3>
        <div style="width: 250px;">
            <input type="text" id="search" placeholder="🔍 Search bill no or customer..." onkeyup="loadBills()"
                style="margin: 0;">
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Invoice No</th>
                    <th>Date Issued</th>
                    <th>Customer Name</th>
                    <th style="text-align: right;">Grand Total</th>
                    <th style="width: 200px; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody id="billTable">
                <tr>
                    <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">Loading
                        transactions...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Beautiful Overlay Invoice Dialog Modal -->
<div class="modal-overlay" id="invoiceModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 class="modal-title" id="modalBillNo">Invoice Detail</h3>
            <button class="modal-close" onclick="closeInvoiceModal()">&times;</button>
        </div>
        <div class="modal-body">
            <!-- Printed Invoice Style Container -->
            <div class="invoice-print" id="invoiceModalContent">
                <!-- Rendered dynamically -->
            </div>
        </div>
        <div class="modal-footer">
            <button class="secondary" onclick="closeInvoiceModal()">Close</button>
            <button class="success" id="btnPrintModalPdf">🖨️ Export PDF</button>
        </div>
    </div>
</div>

<script src="../assets/js/bill-history.js"></script>
