<div class="split-container">
    <!-- Add Customer Panel -->
    <div class="card">
        <h3 id="formTitle" style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <span>➕</span> Add Customer
        </h3>

        <div class="form-group">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="e.g. Rajesh Kumar">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="e.g. 9876543210">
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="City / Area name">
        </div>

        <button onclick="saveCustomer()" style="width: 100%; margin-top: 1rem;">
            Add Customer
        </button>
    </div>

    <!-- Customer Directory Listing -->
    <div class="card" style="padding: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h3>👥 Customer Directory</h3>
            <div style="width: 250px;">
                <input type="text" id="searchCustomer" placeholder="🔍 Search customers..." onkeyup="loadCustomers()"
                    style="margin: 0;">
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px;">ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th style="width: 100px; text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="customerTable">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted);">Loading customer
                            database...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="../assets/js/customers.js"></script>
