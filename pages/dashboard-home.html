<div class="stats-grid">
    <div class="card stat-card blue">
        <div>
            <p>Today's Revenue</p>
            <div class="stat-val" id="statTodaySales">₹ 0</div>
        </div>
        <div class="stat-icon">💰</div>
    </div>

    <div class="card stat-card green">
        <div>
            <p>Invoices Issued</p>
            <div class="stat-val" id="statTodayBills">0</div>
        </div>
        <div class="stat-icon">🧾</div>
    </div>

    <div class="card stat-card">
        <div>
            <p>Total Customers</p>
            <div class="stat-val" id="statTotalCustomers">0</div>
        </div>
        <div class="stat-icon">👥</div>
    </div>

    <div class="card stat-card warning">
        <div>
            <p>Low Stock Alerts</p>
            <div class="stat-val" id="statLowStock">0</div>
        </div>
        <div class="stat-icon">⚠️</div>
    </div>
</div>

<div class="split-container" style="grid-template-columns: 2fr 1fr; margin-top: 1.5rem;">
    <!-- Recent Transactions -->
    <div class="card" style="padding: 1.5rem;">
        <h3 style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <span>⏱️</span> Recent Invoices
        </h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Bill No</th>
                        <th>Customer</th>
                        <th>Date</th>
                        <th>Grand Total</th>
                    </tr>
                </thead>
                <tbody id="recentBillsTable">
                    <tr>
                        <td colspan="4" style="text-align: center; color: var(--text-muted);">Loading invoices...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Quick Actions / Alerts -->
    <div class="card" style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
        <h3 style="display: flex; align-items: center; gap: 0.5rem;">
            <span>🔔</span> Low Stock Warnings
        </h3>
        <div id="lowStockList"
            style="display: flex; flex-direction: column; gap: 0.75rem; max-height: 250px; overflow-y: auto;">
            <p style="text-align: center; color: var(--text-muted);">Checking stock levels...</p>
        </div>
    </div>
</div>

<script src="../assets/js/dashboard-home.js"></script>
