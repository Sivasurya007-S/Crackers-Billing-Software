<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>🎆 Login - Sparkler Billing</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="login-body">

    <div class="card login-box">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <span style="font-size: 3rem; filter: drop-shadow(0 0 10px var(--primary-color));">🎆</span>
        </div>

        <h1>Sparkler Billing</h1>
        <p class="subtitle">Offline Crackers POS System Console</p>

        <div class="form-group">
            <label for="username">User Terminal Name</label>
            <input type="text" id="username" placeholder="Enter username..." value="admin">
        </div>

        <div class="form-group">
            <label for="password">Security Password</label>
            <input type="password" id="password" placeholder="Enter password..." value="admin123">
        </div>

        <button onclick="login()" style="width: 100%; margin-top: 1rem;">
            🚀 Initialize Terminal
        </button>
    </div>

    <script src="../assets/js/login.js"></script>

</body>

</html>
